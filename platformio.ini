[env:waveshare-amoled-216]
; Stejná deska a verze jako Rozhodovač: platforma 8.0.0 = Arduino core 3.3.x.
; Kód potřebuje Arduino core 3.x (ESP_I2S, mbedtls 3), proto je verze zafixovaná.
platform = espressif32 @ ~8.0.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
upload_speed = 921600

board_upload.flash_size = 16MB
board_upload.maximum_size = 3145728
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
; 160 MHz stačí na Wi-Fi, šifrování KLAP i kreslení a bere méně než 240 MHz
board_build.f_cpu = 160000000L
board_build.f_flash = 80000000L

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DXPOWERS_CHIP_AXP2101
    -DCORE_DEBUG_LEVEL=0
    ; Cvaknutí a tóny přes kodek ES8311. 0 = zvuk se vůbec neinicializuje.
    -DPANEL_AUDIO=1
    ; Před hlubokým spánkem vypnout větev ALDO1 (3,3 V pro zvukový kodek).
    ; Experiment na úsporu: kdyby po zapnutí nefungovalo probuzení dotykem, nech 0.
    -DPANEL_SLEEP_AUDIO_RAIL_OFF=0

lib_deps =
    bblanchon/ArduinoJson @ ^7.0.0
